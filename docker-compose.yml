version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: snist_cemp_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: college_event_portal
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  cemp-app:
    build: .
    container_name: snist_cemp_app
    restart: always
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: production
      PORT: 5001
      DB_HOST: mysql-db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: college_event_portal
      JWT_SECRET: snist_cemp_jwt_secret_key_2026_super_secure
    depends_on:
      - mysql-db

volumes:
  mysql_data:
