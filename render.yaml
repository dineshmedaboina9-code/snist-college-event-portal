services:
  - type: web
    name: snist-cemp-portal
    env: node
    plan: free
    buildCommand: npm run build:all
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: college_event_portal
      - key: JWT_SECRET
        generateValue: true
